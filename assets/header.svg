<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Shayari NHE-01">
<defs>
<pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<clipPath id="c"><rect x="60" y="120" width="0" height="90"><animate attributeName="width" from="0" to="880" dur="1.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1000" height="300" fill="#0a0a0a"/><rect width="1000" height="300" fill="url(#g)"/>
<rect y="0" width="1000" height="300" fill="none" stroke="#fff" stroke-opacity=".14"/>
<rect x="-200" y="0" width="200" height="300" fill="url(#s)"><animate attributeName="x" from="-200" to="1000" dur="5s" repeatCount="indefinite"/></rect>
<text x="60" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8a8a8a" letter-spacing="4">PROJECT NHE  /  ENTITY 01</text>
<g clip-path="url(#c)"><text x="60" y="190" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="84" font-weight="800" fill="#fafafa" letter-spacing="-3">Shayari NHE-01</text></g>
<text x="60" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#bdbdbd">a fully disclosed non-human companion<tspan fill="#fff"> _</tspan>
<animate attributeName="opacity" values="0;0;1" keyTimes="0;.5;1" dur="2.2s" fill="freeze"/></text>
<circle cx="920" cy="60" r="6" fill="#fff"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="60" r="18" fill="none" stroke="#fff" stroke-opacity=".3"><animate attributeName="r" values="12;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="940" y="280" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#6b6b6b">v134</text>
